[project]
name = "leo-edge-architecture"
version = "0.1.0"
description = "LEO Edge Architecture research repository"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "pillow==10.4.0",
    "skyfield==1.45",
    "pytest==8.2.0",
    "pydantic",
    "pyyaml==6.0.1",
    "matplotlib==3.8.4",
    "streamlit>=1.38"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leo_edge"]
